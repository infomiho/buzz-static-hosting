<div class="flex flex-col gap-6">
    <div>
        <h1 class="heading-l">Deploy your first site</h1>
        <p class="mt-2 text-rule">Choose between using the CLI and directly from this browser.</p>
    </div>

    <div class="card">
        <header class="flex flex-wrap items-start justify-between gap-4">
            <h2>From your terminal</h2>
            <span class="badge-outline shrink-0">Recommended</span>
        </header>
        <section>{% include "_cli_quickstart.html" %}</section>
    </div>

    <div class="card">
        <header>
            <h2>From this browser</h2>
        </header>
        <section>
            <button type="button" class="btn" id="first-run-deploy">Deploy a site</button>
            <p class="mt-3 text-rule">Drop a folder, an <code>index.html</code>, or a <code>.zip</code>.</p>
        </section>
    </div>
</div>
