<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzz social preview</title>
    <style>
        :root {
            --ink: #0b0c0c;
            --paper: #ffffff;
            --mist: #f3f2f1;
            --font-sans: Arial, ui-sans-serif, system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 1200px;
            height: 630px;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: var(--mist);
            color: var(--ink);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        main {
            display: grid;
            grid-template-columns: 456px 1fr;
            height: 100%;
            border: 16px solid var(--ink);
        }

        .message {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px 46px 44px;
            background: var(--paper);
            border-right: 4px solid var(--ink);
        }

        .brand {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        h1 {
            max-width: 380px;
            margin: 0;
            font-size: 62px;
            line-height: 0.96;
            letter-spacing: -0.055em;
        }

        .domain {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }

        .flow {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 46px 30px;
            background: var(--mist);
        }

        .flow svg {
            display: block;
            width: 640px;
            height: 400px;
        }
    </style>
</head>
<body>
    <main>
        <section class="message">
            <div class="brand">Buzz</div>
            <h1>Static sites.<br>Your server.</h1>
            <p class="domain">buzzstatic.dev</p>
        </section>
        <section class="flow" aria-label="A directory deployed to a stable site URL">
            <svg viewBox="0 0 640 400" role="img" aria-labelledby="diagram-title diagram-desc" font-family="Arial, ui-sans-serif, system-ui, sans-serif">
                <title id="diagram-title">Buzz deployment flow</title>
                <desc id="diagram-desc">A dist directory is deployed with the Buzz CLI to a stable site URL.</desc>

                <g fill="#fff" stroke="#0b0c0c" stroke-width="4">
                    <g transform="translate(10 74)">
                        <rect width="184" height="252" />
                        <path d="M0 48h184" />
                        <path d="M0 0v-20h86l20 20" />
                        <text x="20" y="33" fill="#0b0c0c" stroke="none" font-size="25" font-weight="700">dist/</text>
                        <rect x="20" y="76" width="144" height="48" fill="#f3f2f1" />
                        <text x="34" y="107" fill="#0b0c0c" stroke="none" font-size="20">index.html</text>
                        <rect x="20" y="142" width="116" height="14" fill="#b1b4b6" stroke="none" />
                        <rect x="20" y="174" width="144" height="14" fill="#b1b4b6" stroke="none" />
                    </g>

                    <g transform="translate(224 146)">
                        <rect width="192" height="108" fill="#0b0c0c" />
                        <text x="18" y="42" fill="#fff" stroke="none" font-size="19">$ buzz deploy</text>
                        <text x="18" y="76" fill="#fff" stroke="none" font-size="24" font-weight="700">./dist</text>
                    </g>

                    <path d="M194 200h30" fill="none" />
                    <path d="M416 200h30" fill="none" />
                    <path d="m434 188 12 12-12 12" fill="none" />

                    <g transform="translate(446 74)">
                        <rect width="184" height="252" />
                        <rect width="184" height="52" fill="#f3f2f1" />
                        <circle cx="24" cy="26" r="5" fill="#0b0c0c" stroke="none" />
                        <circle cx="44" cy="26" r="5" fill="#0b0c0c" stroke="none" />
                        <circle cx="64" cy="26" r="5" fill="#0b0c0c" stroke="none" />
                        <rect x="16" y="76" width="152" height="48" />
                        <text x="30" y="107" fill="#0b0c0c" stroke="none" font-size="20">site.example</text>
                        <rect x="16" y="152" width="120" height="20" fill="#0b0c0c" stroke="none" />
                        <rect x="16" y="194" width="152" height="12" fill="#b1b4b6" stroke="none" />
                    </g>
                </g>

                <text x="446" y="365" fill="#0b0c0c" font-size="22" font-weight="700">Stable URL</text>
            </svg>
        </section>
    </main>
</body>
</html>
