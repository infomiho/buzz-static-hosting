<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"
     font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <!-- Desktop 1280x800. Existing site detail under the existing dialog pattern. -->
  <rect x="0" y="0" width="1280" height="800" />

  <!-- 1: existing page underlay -->
  <g opacity="0.45" data-region="underlay">
    <rect x="0" y="0" width="1280" height="64" fill="#000" />
    <text x="144" y="40" font-size="20" font-weight="600" stroke="none" fill="#fff">Buzz</text>
    <text x="144" y="120" font-size="14" text-decoration="underline" stroke="none" fill="#000">Back to dashboard</text>
    <text x="144" y="184" font-size="28" font-weight="700" stroke="none" fill="#000">annual-report.buzz.example</text>
    <rect x="144" y="296" width="992" height="392" />
  </g>
  <rect x="0" y="0" width="1280" height="800" fill="#000" fill-opacity="0.4" stroke="none" />

  <!-- 2: Manage access dialog -->
  <g transform="translate(320,120)" data-region="manage-dialog">
    <rect width="640" height="416" />
    <text x="24" y="48" font-size="20" font-weight="600" stroke="none" fill="#000">Manage access</text>
    <text x="24" y="72" font-size="14" stroke="none" fill="#666">annual-report.buzz.example</text>
    <line x1="0" y1="96" x2="640" y2="96" />

    <text x="24" y="136" font-size="14" font-weight="600" stroke="none" fill="#000">People with access</text>
    <g transform="translate(472,112)">
      <rect width="144" height="40" />
      <text x="72" y="25" font-size="14" font-weight="600" text-anchor="middle" stroke="none" fill="#000">Add GitHub user</text>
    </g>

    <g transform="translate(24,168)">
      <rect width="592" height="72" />
      <circle cx="40" cy="36" r="16" fill="#e6e6e6" />
      <text x="72" y="32" font-size="14" font-weight="600" stroke="none" fill="#000">owner</text>
      <text x="72" y="52" font-size="12" stroke="none" fill="#666">@owner</text>
      <text x="560" y="40" font-size="14" text-anchor="end" stroke="none" fill="#666">Owner</text>
    </g>
    <g transform="translate(24,240)">
      <rect width="592" height="72" />
      <circle cx="40" cy="36" r="16" fill="#e6e6e6" />
      <text x="72" y="32" font-size="14" font-weight="600" stroke="none" fill="#000">The Octocat</text>
      <text x="72" y="52" font-size="12" stroke="none" fill="#666">@octocat</text>
      <g transform="translate(472,16)">
        <rect width="96" height="40" />
        <text x="48" y="25" font-size="14" font-weight="600" text-anchor="middle" stroke="none" fill="#000">Remove</text>
      </g>
    </g>

    <line x1="0" y1="344" x2="640" y2="344" />
    <g transform="translate(496,360)">
      <rect width="120" height="40" />
      <text x="60" y="25" font-size="14" font-weight="600" text-anchor="middle" stroke="none" fill="#000">Close</text>
    </g>
  </g>

  <!-- 4: annotation -->
  <g data-region="annotations">
    <circle cx="952" cy="248" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2" />
    <text x="952" y="252" font-size="12" font-weight="700" text-anchor="middle" stroke="none" fill="#d33">1</text>
  </g>
</svg>
