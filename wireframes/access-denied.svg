<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812"
     font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <!-- Mobile 375x812. Existing base.html and access_denied.html structure. -->
  <rect x="0" y="0" width="375" height="812" />

  <!-- 1: existing Buzz header with signed-in account -->
  <g transform="translate(0,0)" data-region="header">
    <rect width="375" height="64" fill="#000" />
    <text x="16" y="40" font-size="20" font-weight="600" stroke="none" fill="#fff">Buzz</text>
    <circle cx="272" cy="32" r="16" fill="#e6e6e6" stroke="#fff" />
    <text x="296" y="40" font-size="14" font-weight="600" stroke="none" fill="#fff">someone</text>
  </g>

  <!-- 2: existing denied card with generalized copy -->
  <g transform="translate(16,112)" data-region="denied-card">
    <rect width="343" height="352" stroke-width="3" />
    <text x="24" y="40" font-size="12" font-weight="600" stroke="none" fill="#000">▣  ACCESS CONTROL</text>
    <text x="24" y="96" font-size="28" font-weight="700" stroke="none" fill="#000">Access denied</text>
    <text x="24" y="144" font-size="14" stroke="none" fill="#666">@someone does not have access to</text>
    <text x="24" y="168" font-size="14" stroke="none" fill="#666">annual-report.buzz.example.</text>
    <text x="24" y="216" font-size="14" stroke="none" fill="#666">Ask the site owner to add this GitHub account,</text>
    <text x="24" y="240" font-size="14" stroke="none" fill="#666">or sign in with another one.</text>
    <g transform="translate(24,280)">
      <rect width="224" height="40" />
      <text x="112" y="25" font-size="14" font-weight="600" text-anchor="middle" stroke="none" fill="#000">Sign in as someone else</text>
    </g>
  </g>

  <!-- 3: existing footer -->
  <g transform="translate(0,696)" data-region="footer">
    <rect width="375" height="116" fill="#e6e6e6" />
    <text x="16" y="40" font-size="14" font-weight="600" stroke="none" fill="#000">Self-hosted static site hosting.</text>
    <text x="16" y="72" font-size="14" text-decoration="underline" stroke="none" fill="#000">Source on GitHub</text>
  </g>

  <!-- 4: annotation -->
  <g data-region="annotations">
    <rect x="32" y="224" width="311" height="144" fill="none" stroke="#d33" stroke-dasharray="6 3" />
    <circle cx="352" cy="232" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2" />
    <text x="352" y="236" font-size="12" font-weight="700" text-anchor="middle" stroke="none" fill="#d33">1</text>
  </g>
</svg>
