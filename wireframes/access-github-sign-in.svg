<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812"
     font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <!-- Mobile 375x812. Existing Buzz header and login panel in its pending state. -->
  <rect x="0" y="0" width="375" height="812" />

  <!-- 1: existing Buzz header -->
  <g transform="translate(0,0)" data-region="header">
    <rect width="375" height="64" fill="#000" />
    <text x="16" y="40" font-size="20" font-weight="600" stroke="none" fill="#fff">Buzz</text>
  </g>

  <!-- 2: access-specific context replacing the generic deploy hero -->
  <g transform="translate(16,104)" data-region="context">
    <text x="0" y="28" font-size="28" font-weight="700" stroke="none" fill="#000">Sign in to continue</text>
    <text x="0" y="64" font-size="14" stroke="none" fill="#666">Open annual-report.buzz.example</text>
  </g>

  <!-- 3: existing login panel, pending state -->
  <g transform="translate(16,208)" data-region="login-panel">
    <rect width="343" height="384" stroke-width="3" />
    <text x="24" y="48" font-size="20" font-weight="600" stroke="none" fill="#000">Sign in</text>
    <text x="24" y="80" font-size="14" stroke="none" fill="#666">Use GitHub to prove which account you control.</text>
    <line x1="24" y1="112" x2="319" y2="112" />
    <text x="24" y="152" font-size="14" stroke="none" fill="#000">Enter this code on GitHub:</text>
    <text x="24" y="208" font-size="28" font-weight="700" stroke="none" fill="#000">ABCD-1234</text>
    <g transform="translate(24,240)">
      <rect width="200" height="40" />
      <text x="100" y="25" font-size="14" font-weight="600" text-anchor="middle" stroke="none" fill="#000">Open GitHub ↗</text>
    </g>
    <text x="24" y="320" font-size="14" stroke="none" fill="#666">Waiting for authorization...</text>
    <text x="24" y="352" font-size="12" stroke="none" fill="#666">You will return to the private site automatically.</text>
  </g>

  <!-- 4: control-plane boundary note -->
  <g transform="translate(16,624)" data-region="boundary-note">
    <rect width="343" height="96" fill="#e6e6e6" />
    <text x="16" y="32" font-size="14" font-weight="600" stroke="none" fill="#000">Site access only</text>
    <text x="16" y="56" font-size="12" stroke="none" fill="#666">Signing in here does not let you deploy or manage</text>
    <text x="16" y="80" font-size="12" stroke="none" fill="#666">sites unless this Buzz server separately allows it.</text>
  </g>

  <!-- 5: annotations -->
  <g data-region="annotations">
    <rect x="16" y="104" width="343" height="72" fill="none" stroke="#d33" stroke-dasharray="6 3" />
    <circle cx="360" cy="112" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2" />
    <text x="360" y="116" font-size="12" font-weight="700" text-anchor="middle" stroke="none" fill="#d33">1</text>
  </g>
</svg>
